<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 65" width="250" height="65">
  <!-- Icon Group -->
  <g transform="translate(5, 5)">
    <!-- Magnifying glass handle -->
    <rect x="36" y="36" width="16" height="6" rx="3" transform="rotate(45 36 36)" fill="#0f172a" />
    
    <!-- Outer circle border (dark blue) -->
    <path d="M 27 6 A 21 21 0 1 0 45 27" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
    
    <!-- Outer circle arc (bright blue) -->
    <path d="M 45 27 A 21 21 0 0 0 27 6" fill="none" stroke="#0066ff" stroke-width="5" stroke-linecap="round" />
    
    <!-- Person inside: Head -->
    <circle cx="25" cy="18" r="6" fill="#0066ff" />
    
    <!-- Person inside: Shoulders & Tie -->
    <path d="M 14 34 C 14 27, 36 27, 36 34" fill="#0066ff" />
    <!-- White tie detail -->
    <path d="M 24 28 L 26 28 L 27 33 L 25 35 L 23 33 Z" fill="#ffffff" />
  </g>

  <!-- Text Group -->
  <g transform="translate(68, 12)">
    <!-- CareerNest Text -->
    <text x="0" y="24" font-family="'Outfit', 'Inter', sans-serif" font-size="26" font-weight="800" fill="#0f172a">
      Career<tspan fill="#0066ff">Nest</tspan>
    </text>
    <!-- Subtitle -->
    <text x="1" y="42" font-family="'Outfit', 'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#475569" letter-spacing="0.5">
      Find Jobs. Build Future.
    </text>
  </g>
</svg>
